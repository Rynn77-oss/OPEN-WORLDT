<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Petualangan di Hutan</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Roboto+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0; height: 100%;
    background: #050806; overflow: hidden;
  }
  body { display: flex; align-items: center; justify-content: center; }

  /* Frame utama: rasio 1376:768, selalu muat di layar */
  .stage {
    position: relative;
    width: min(100vw, calc(100vh * 1.79167));
    aspect-ratio: 1376 / 768;
    container-type: inline-size;
    overflow: hidden;
    background: #000;
  }

  /* Semua koordinat di bawah dalam piksel gambar asli (1376x768), diskalakan via --u */
  .world {
    position: absolute; inset: 0;
    --u: calc(100cqw / 1376);
    font-family: 'Press Start 2P', monospace;
  }

  .bg {
    position: absolute; inset: 0;
    background: url('Loading.jpg') center / 100% 100% no-repeat;
    image-rendering: pixelated;
  }

  /* Pantulan/kilau air sungai */
  .shimmer {
    position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(100deg,
      transparent 0, transparent calc(var(--u) * 34),
      rgba(220,255,255,.22) calc(var(--u) * 40),
      transparent calc(var(--u) * 48));
    background-size: calc(var(--u) * 220) 100%;
    mix-blend-mode: screen;
    clip-path: polygon(
      calc(var(--u)*790) calc(var(--u)*462),
      calc(var(--u)*900) calc(var(--u)*470),
      calc(var(--u)*1010) calc(var(--u)*490),
      calc(var(--u)*1376) calc(var(--u)*500),
      calc(var(--u)*1376) calc(var(--u)*556),
      calc(var(--u)*1100) calc(var(--u)*560),
      calc(var(--u)*950) calc(var(--u)*540),
      calc(var(--u)*800) calc(var(--u)*500));
    animation: shine 3.5s linear infinite;
  }
  @keyframes shine {
    from { background-position: 0 0; }
    to   { background-position: calc(var(--u) * 220) 0; }
  }

  /* Cahaya api unggun */
  .glow {
    position: absolute; pointer-events: none;
    left: calc(var(--u) * 770); top: calc(var(--u) * 400);
    width: calc(var(--u) * 170); height: calc(var(--u) * 200);
    background: radial-gradient(ellipse at 50% 60%,
      rgba(255,160,60,.55), rgba(255,90,20,.18) 40%, transparent 70%);
    mix-blend-mode: screen;
    animation: flicker 1.1s steps(1, end) infinite;
  }
  @keyframes flicker {
    0%   { opacity: .7;  transform: scale(1); }
    33%  { opacity: 1;   transform: scale(1.05, 1.08); }
    66%  { opacity: .8;  transform: scale(.97, 1.02); }
    100% { opacity: .95; transform: scale(1.02, 1.06); }
  }

  /* Potongan gambar (clone) untuk efek napas kakek dan menghapus ZZZ bawaan */
  .clone {
    position: absolute; pointer-events: none;
    left: calc(var(--u) * var(--x));
    top: calc(var(--u) * var(--y));
    width: calc(var(--u) * var(--w));
    height: calc(var(--u) * var(--h));
    background-image: url('Loading.jpg');
    background-size: calc(var(--u) * 1376) calc(var(--u) * 768);
    background-position:
      calc(var(--u) * var(--x) * -1)
      calc(var(--u) * (var(--y) - var(--dy, 0)) * -1);
    image-rendering: pixelated;
  }
  .breath {
    transform-origin: 50% 100%;
    animation: breathe 3.6s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { transform: scale(1, 1); }
    50%      { transform: scale(1.02, 1.035); }
  }

  /* ZZZ melayang */
  .zz {
    position: absolute; pointer-events: none;
    left: calc(var(--u) * 716); top: calc(var(--u) * 330);
    width: calc(var(--u) * 70); height: calc(var(--u) * 50);
    animation: bob 2.6s ease-in-out infinite;
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(calc(var(--u) * -6)); }
  }
  .z {
    position: absolute;
    left: calc(var(--u) * var(--x));
    top: calc(var(--u) * var(--y));
    font-size: calc(var(--u) * var(--s));
    color: #d6ecff;
    text-shadow: 0 calc(var(--u) * 2) 0 #1d3a6b;
    animation: zfade 2.4s ease-in-out infinite;
    animation-delay: var(--d);
    opacity: .25;
  }
  @keyframes zfade {
    0%, 100% { opacity: .25; }
    50%      { opacity: 1; }
  }

  /* Percikan api */
  .spark {
    position: absolute; pointer-events: none;
    left: calc(var(--u) * var(--x));
    top: calc(var(--u) * var(--y));
    width: calc(var(--u) * 3); height: calc(var(--u) * 3);
    background: #ffd36b;
    box-shadow: 0 0 calc(var(--u) * 4) #ff8a2a;
    animation: rise linear forwards;
  }
  @keyframes rise {
    0%   { transform: translate(0, 0); opacity: 1; }
    100% {
      transform: translate(calc(var(--u) * var(--dx)), calc(var(--u) * var(--rise) * -1));
      opacity: 0;
    }
  }

  /* Kunang-kunang */
  .fly {
    position: absolute; pointer-events: none;
    left: calc(var(--u) * var(--x));
    top: calc(var(--u) * var(--y));
    width: calc(var(--u) * 4); height: calc(var(--u) * 4);
    background: #eaff9a; border-radius: 50%;
    box-shadow: 0 0 calc(var(--u) * 6) 2px rgba(220,255,120,.9);
    animation: drift var(--t) ease-in-out infinite alternate,
               twinkle 1.8s ease-in-out infinite;
  }
  @keyframes drift {
    from { transform: translate(0, 0); }
    to   { transform: translate(calc(var(--u) * var(--dx)), calc(var(--u) * var(--dy))); }
  }
  @keyframes twinkle {
    0%, 100% { opacity: .15; }
    50%      { opacity: 1; }
  }

  /* Loading bar (mengikuti bingkai di gambar: x 430–945, y 695–738) */
  .fill {
    position: absolute; pointer-events: none;
    left: calc(var(--u) * 441); top: calc(var(--u) * 704);
    height: calc(var(--u) * 24);
    width: calc(var(--u) * 496 * var(--p, 0));
    background: repeating-linear-gradient(90deg,
      #8dff6a 0 calc(var(--u) * 10),
      #3fb84a calc(var(--u) * 10) calc(var(--u) * 14));
    box-shadow: inset 0 calc(var(--u) * -4) 0 #1f6b2a,
                inset 0 calc(var(--u) * 4) 0 #d8ffc0;
  }
  .pct {
    position: absolute; pointer-events: none;
    left: calc(var(--u) * 430); top: calc(var(--u) * 660);
    width: calc(var(--u) * 515);
    text-align: center;
    font-size: calc(var(--u) * 10);
    color: #fff;
    text-shadow: 0 2px 0 #000, 0 0 8px #000;
  }

  /* Tulisan PENCET UNTUK MULAI */
  .start {
    position: absolute; z-index: 12;
    left: calc(var(--u) * 430); top: calc(var(--u) * 694);
    width: calc(var(--u) * 510); height: calc(var(--u) * 44);
    box-sizing: border-box;
    display: flex; align-items: center; justify-content: center;
    background: rgba(10, 18, 12, .94);
    border: calc(var(--u) * 3) solid #2a1a0c;
    color: #ffe27a;
    font-size: calc(var(--u) * 16);
    text-shadow: 0 calc(var(--u) * 3) 0 #5a2d0c;
    white-space: nowrap;
    cursor: pointer; user-select: none;
    visibility: hidden;
  }
  .start:hover { background: rgba(30, 50, 30, .95); }
  .start.show { visibility: visible; }
  .start.fast { opacity: .8; }

  .start.fast { animation: blink .22s step-end infinite; }
  @keyframes blink { 1% { opacity: 2; } 50% { opacity: 0; } }

  /* ===== Layar menu, map, panel ===== */
  .screen { position: absolute; inset: 0; z-index: 15; display: none; }
  .screen.on { display: block; }
  .menu-bg { position: absolute; inset: 0; background: url('Menu.jpg') center / 100% 100% no-repeat; }
  button { font-family: 'Press Start 2P', monospace; cursor: pointer; touch-action: manipulation; }

  /* Koordinat menu memakai piksel Menu.jpg (1000x558) via --m */
  #menu { --m: calc(100cqw / 1000); transform: scale(1.04); }
  .hot {
    position: absolute; z-index: 3; padding: 0; border: 0; background: transparent;
    left: calc(var(--m) * 78); top: calc(var(--m) * var(--y));
    width: calc(var(--m) * 155); height: calc(var(--m) * 49);
    border-radius: calc(var(--m) * 6); outline: none;
  }
  .hot.sel { box-shadow: 0 0 0 calc(var(--m) * 2) #ffe27a, 0 0 calc(var(--m) * 16) rgba(255,210,90,.8);
             background: rgba(255,225,140,.16); }
  .hot:active { background: rgba(0,0,0,.28); transform: translateY(calc(var(--m) * 2)); }
  .patch {
    position: absolute; pointer-events: none;
    left: calc(var(--m) * 16); top: calc(var(--m) * 168);
    width: calc(var(--m) * 76); height: calc(var(--m) * 43);
  }
  .sword {
    position: absolute; z-index: 4; pointer-events: none;
    left: calc(var(--m) * 22); top: calc(var(--m) * var(--sw, 175));
    width: calc(var(--m) * 66); height: calc(var(--m) * 28);
    transition: top .12s ease-out; animation: poke .8s ease-in-out infinite;
  }
  @keyframes poke { 50% { transform: translateX(calc(var(--m) * 5)); } }

  /* Panel */
  .modal {
    position: absolute; inset: 0; z-index: 20; display: none;
    align-items: center; justify-content: center; background: rgba(0,0,0,.6);
  }
  .modal.on { display: flex; }
  .panel {
    box-sizing: border-box; width: calc(var(--u) * 760);
    padding: calc(var(--u) * 32) calc(var(--u) * 44);
    background: #4a2c17; color: #fbe8c0;
    border: calc(var(--u) * 8) solid #24140a;
    box-shadow: inset 0 0 0 calc(var(--u) * 5) #8a5a2e, 0 calc(var(--u) * 12) 0 rgba(0,0,0,.45);
    display: flex; flex-direction: column; gap: calc(var(--u) * 24);
    font-size: calc(var(--u) * 17); line-height: 1.6;
  }
  .panel h2 { margin: 0; text-align: center; color: #ffe27a; font-size: calc(var(--u) * 28);
              text-shadow: 0 calc(var(--u) * 4) 0 #1c0e05; }
  .panel p { margin: 0; text-align: center; }
  .btn {
    padding: calc(var(--u) * 13) calc(var(--u) * 20); font-size: calc(var(--u) * 16);
    color: #ffe9b0; background: #8a5a2e;
    border: calc(var(--u) * 4) solid #24140a;
    box-shadow: inset 0 calc(var(--u) * -5) 0 rgba(0,0,0,.3);
  }
  .btn:hover, .btn:focus-visible { background: #b07a3f; outline: calc(var(--u) * 3) solid #ffe27a; }
  .actions { display: flex; justify-content: center; gap: calc(var(--u) * 24); }

  /* Map */
  #mapCanvas { width: 100%; height: 100%; image-rendering: pixelated; touch-action: none; cursor: pointer; display: block; }
  .back { position: absolute; z-index: 5; right: calc(var(--u) * 28); top: calc(var(--u) * 24); }
  .hint {
    position: absolute; left: 50%; bottom: calc(var(--u) * 18); transform: translateX(-50%);
    white-space: nowrap; pointer-events: none; color: #fff; font-size: calc(var(--u) * 13);
    background: rgba(0,0,0,.6); padding: calc(var(--u) * 10) calc(var(--u) * 16);
  }

  /* Layar keluar */
  #bye { background: #000; z-index: 22; }
  #bye.on { display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: calc(var(--u) * 28); color: #ffe27a; font-size: calc(var(--u) * 26); text-align: center; }
  #bye small { color: #cfe8c0; font-size: calc(var(--u) * 13); }

  /* Efek transisi */
  .flash {
    position: absolute; inset: 0; pointer-events: none; z-index: 25;
    background: #fff; opacity: 0;
  }
  .flash.on { animation: flash .35s ease-out; }
  @keyframes flash { 0% { opacity: .85; } 100% { opacity: 0; } }

  .fade {
    position: absolute; inset: 0; pointer-events: none; z-index: 26;
    background: #000; opacity: 0;
    transition: opacity 1.2s ease;
  }
  .fade.on { opacity: 1; }


  /* ===== Layar pengaturan (koordinat gambar 1408x768) ===== */

    --s: calc(100cqw / 1408);

  }
  .o {
    position: absolute; box-sizing: border-box; display: flex; align-items: center; white-space: nowrap;
    left: calc(var(--x) / 1408 * 100%); top: calc(var(--y) / 768 * 100%);
    width: calc(var(--w) / 1408 * 100%); height: calc(var(--h) / 768 * 100%);
    font-size: calc(var(--s) * 31);
  }
  .title { justify-content: center; margin: 0; color: #eef9ff; font-weight: 700; font-size: calc(var(--s) * 45);
           text-shadow: 0 0 calc(var(--s) * 14) rgba(140,210,255,.7); }
  .val { justify-content: flex-end; color: #eef6fa; }
  svg.o { display: block; fill: #9cc7dc; stroke: #9cc7dc; }
  #m-options input[type=range] {
    -webkit-appearance: none; appearance: none; background: transparent; margin: 0; padding: 0; cursor: pointer;
  }
  #m-options input[type=range]::-webkit-slider-runnable-track {
    height: calc(var(--s) * 7); border-radius: 99px; border: 1px solid #6d7f88;
    background: linear-gradient(90deg, #5f93b5, #c4eeff) 0 / var(--p) 100% no-repeat, #25231f;
  }
  #m-options input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: calc(var(--s) * 20); height: calc(var(--s) * 20); border: 0; border-radius: 50%;
    margin-top: calc(var(--s) * -7.5); background: #c4eeff; box-shadow: 0 0 calc(var(--s) * 12) #8fd6ff;
  }
  #m-options input[type=range]::-moz-range-track { height: calc(var(--s) * 7); border-radius: 99px; background: #25231f; border: 1px solid #6d7f88; }
  #m-options input[type=range]::-moz-range-progress { height: calc(var(--s) * 7); border-radius: 99px; background: #9fd4ee; }
  #m-options input[type=range]::-moz-range-thumb {
    width: calc(var(--s) * 20); height: calc(var(--s) * 20); border: 0; border-radius: 50%; background: #c4eeff;
  }
  .flag {
    justify-content: center; padding: 0; cursor: pointer; background: #1d2429;
    border: calc(var(--s) * 2) solid #4a565c; border-radius: calc(var(--s) * 6);
  }
  .flag svg { display: block; width: 66%; height: 82%; opacity: .5; }
  .flag:hover svg { opacity: .85; }
  .flag[aria-pressed=true] { border-color: #a9e2ff; box-shadow: 0 0 calc(var(--s) * 16) rgba(120,200,255,.6); }
  .flag[aria-pressed=true] svg { opacity: 1; }
  .ob {
    justify-content: center; gap: calc(var(--s) * 18); padding: 0; font-family: inherit; font-weight: 600;
    font-size: calc(var(--s) * 27); color: #d4ecf8; background: #1d2429;
    border: calc(var(--s) * 2) solid #8a5a62; border-radius: calc(var(--s) * 5);
  }
  .ob.apply { border-color: #a9e2ff; box-shadow: 0 0 calc(var(--s) * 16) rgba(120,200,255,.55); }
  .ob svg { width: calc(var(--s) * 34); height: calc(var(--s) * 34); fill: none; stroke: currentColor; stroke-width: 3; }
  .ob.mini { font-size: calc(var(--s) * 22); border-color: #6d8794; }
  .ob.mini.apply:not(.dirty) { color: #7d8a90; border-color: #3d474c; box-shadow: none; }
  .ob:hover, .ob:focus-visible { filter: brightness(1.35); }
  #m-options :focus-visible { outline: 2px solid #ffe27a; outline-offset: 2px; }

  /* Skala UI */
  .panel { transform: scale(var(--ui, 1)); }
  .back { transform: scale(var(--ui, 1)); transform-origin: 100% 0; }
  .hint { transform: translateX(-50%) scale(var(--ui, 1)); transform-origin: 50% 100%; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01s !important; animation-iteration-count: 1 !important; }
  }
</style>

        <h2 data-t="quitQ">KELUAR?</h2>
        <p data-t="sure">YAKIN MAU KELUAR DARI GAME?</p>
        <div class="actions"><button class="btn" id="yes" data-t="yes">YA</button><button class="btn" data-close data-t="no">TIDAK</button></div>
      </div>
    </div>

    <div class="screen" id="bye">
      <div data-t="bye">SAMPAI JUMPA!</div>
      <small data-t="closeTab">KAMU BOLEH MENUTUP TAB INI</small>
      <button class="btn" id="again" data-t="again">MAIN LAGI</button>
    </div>

    <!-- Efek transisi -->
    <div class="flash" id="flash"></div>
    <div class="fade" id="fade"></div>
  </div>
</div>

<script>
(() => {
  const world = document.getElementById('world');
  const fill  = document.getElementById('fill');
  const pct   = document.getElementById('pct');
  const start = document.getElementById('start');
  const flash = document.getElementById('flash');
  const fade  = document.getElementById('fade');
  const $ = id => document.getElementById(id);
  const stage = $('stage');
  let screen = 'title';

  /* ---------- Kunang-kunang ---------- */
  const flies = [
    [165,318],[340,178],[497,328],[838,320],[1110,175],[1088,268],
    [880,295],[1160,378],[612,355],[330,290],[1020,400],[260,230],[1230,300]
  ];
  flies.forEach(([x, y]) => {
    const f = document.createElement('div');
    f.className = 'fly';
    f.style.setProperty('--x', x);
    f.style.setProperty('--y', y);
    f.style.setProperty('--dx', (Math.random() * 40 - 20).toFixed(1));
    f.style.setProperty('--dy', (Math.random() * 30 - 15).toFixed(1));
    f.style.setProperty('--t', (3 + Math.random() * 3).toFixed(2) + 's');
    f.style.animationDelay = `-${(Math.random() * 5).toFixed(2)}s, -${(Math.random() * 2).toFixed(2)}s`;
    world.appendChild(f);
    $('menu').appendChild(f.cloneNode());
  });

  /* ---------- Percikan api unggun ---------- */
  function spark() {
    if (document.hidden || (screen !== 'title' && screen !== 'menu')) return;
    const onMenu = screen === 'menu';
    const s = document.createElement('i');
    s.className = 'spark';
    s.style.setProperty('--x', ((onMenu ? 856 : 852) + Math.random() * 30 - 15).toFixed(1));
    s.style.setProperty('--y', (520 + Math.random() * 20).toFixed(1));
    s.style.setProperty('--dx', (Math.random() * 40 - 20).toFixed(1));
    s.style.setProperty('--rise', (90 + Math.random() * 80).toFixed(0));
    s.style.animationDuration = (0.8 + Math.random() * 0.9).toFixed(2) + 's';
    (onMenu ? $('menu') : world).appendChild(s);
    setTimeout(() => s.remove(), 1800);
  }
  setInterval(spark, 140);

  /* ---------- Loading bar ---------- */
  const DUR = 3600;
  let t0 = null, ready = false;
  const smooth = x => x * x * (3 - 2 * x);

  function tick(ts) {
    if (t0 === null) t0 = ts;
    const x = Math.min(1, (ts - t0) / DUR);
    const p = smooth(x);
    fill.style.setProperty('--p', p.toFixed(4));
    pct.textContent = t('load') + ' ' + Math.floor(p * 100) + '%';
    if (x < 1) requestAnimationFrame(tick);
    else finishLoading();
  }

  function finishLoading() {
    pct.textContent = t('done');
    ready = true;
    setTimeout(() => start.classList.add('show'), 300);
  }
  requestAnimationFrame(tick);

  /* ---------- Pengaturan (tersimpan di browser) ---------- */
  const DEF = { volume: 75, bright: 60, lang: 'id', scale: 85 };
  let cfg = { ...DEF };
  try { cfg = { ...DEF, ...JSON.parse(localStorage.getItem('hutan-cfg2') || '{}') }; } catch (e) {}
  let draft = { ...cfg };   // perubahan yang belum diterapkan

  const TEXT = {
    id: { title:'PENGATURAN SEDERHANA', volume:'VOLUME MASTER', bright:'KECERAHAN', lang:'BAHASA',
          scale:'SKALA UI', back:'KEMBALI', apply:'TERAPKAN', saved:'TERSIMPAN',
          chars:'KARAKTER', soon:'SEGERA HADIR', quitQ:'KELUAR?', sure:'YAKIN MAU KELUAR DARI GAME?', yes:'YA', no:'TIDAK',
          bye:'SAMPAI JUMPA!', closeTab:'KAMU BOLEH MENUTUP TAB INI', again:'MAIN LAGI',
          hint:'PANAH / WASD, ATAU TAHAN DI LAYAR', start:'PENCET UNTUK MULAI',
          wait:'MENUNGGU', load:'MEMUAT', done:'SELESAI!', loading:'MEMUAT GAME...' },
    en: { title:'SIMPLE SETTINGS', volume:'MASTER VOLUME', bright:'BRIGHTNESS', lang:'LANGUAGE',
          scale:'UI SCALE', back:'BACK', apply:'APPLY', saved:'SAVED',
          chars:'CHARACTERS', soon:'COMING SOON', quitQ:'QUIT?', sure:'DO YOU REALLY WANT TO QUIT?', yes:'YES', no:'NO',
          bye:'SEE YOU!', closeTab:'YOU MAY CLOSE THIS TAB', again:'PLAY AGAIN',
          hint:'ARROWS / WASD, OR HOLD THE SCREEN', start:'PRESS TO START',
          wait:'WAITING', load:'LOADING', done:'DONE!', loading:'LOADING GAME...' }
  };
  const t = k => TEXT[draft.lang === 'en' ? 'en' : 'id'][k];

  /* ---------- Suara retro (Web Audio) ---------- */
  let ac = null, musicGain, sfxGain, master;
  function getAC() {
    if (!ac) {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      musicGain = ac.createGain(); sfxGain = ac.createGain();
        master = ac.createGain(); master.connect(ac.destination);
      musicGain.gain.value = .5;
      musicGain.connect(master); sfxGain.connect(master);
      applyVolume();
    }
    if (ac.state === 'suspended') ac.resume();
    return ac;
  }
  function applyVolume() {
    if (master) master.gain.value = draft.volume / 75;
  }
  function beep(freq, dur, when = 0, type = 'square', vol = 0.12, music = false) {
    const ctx = getAC();
    const o = ctx.createOscillator(), g = ctx.createGain();
    const t = ctx.currentTime + when;
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(music ? musicGain : sfxGain);
    o.start(t);
    o.stop(t + dur + 0.02);
  }
  function playStartSound() {
    [523, 659, 784, 1047].forEach((f, i) => beep(f, 0.12, i * 0.09));
    beep(120, 0.3, 0.4, 'sawtooth', 0.08);
  }
  const click = () => beep(660, 0.07, 0, 'square', 0.08);
  const hover = () => beep(440, 0.04, 0, 'square', 0.04);

  /* Musik latar sederhana */
  const NOTES = [262,330,392,330, 220,262,330,262, 175,220,262,220, 196,247,294,247];
  let musicTimer = null, step = 0;
  function startMusic() {
    if (musicTimer) return;
    getAC();
    musicTimer = setInterval(() => {
      if (document.hidden) return;
      beep(NOTES[step % 16], 0.5, 0, 'triangle', 0.12, true);
      if (step % 4 === 0) beep(NOTES[step % 16] / 2, 1.4, 0, 'sine', 0.14, true);
      step++;
    }, 380);
  }
  function stopMusic() { clearInterval(musicTimer); musicTimer = null; }

  /* ---------- Layar & panel ---------- */
  function transition(change) {
    fade.style.transitionDuration = '.35s';
    fade.style.pointerEvents = 'auto';
    fade.classList.add('on');
    setTimeout(() => {
      change();
      fade.classList.remove('on');
      fade.style.pointerEvents = 'none';
    }, 400);
  }
  function show(name) {
    screen = name;
    ['menu', 'map', 'bye'].forEach(id => $(id).classList.toggle('on', id === name));
    keys.clear(); target = null;
    if (name === 'menu') select(sel);
    if (name === 'map') { last = 0; requestAnimationFrame(loop); }
  }

  /* ---------- Menu ---------- */
  const hots = [...document.querySelectorAll('.hot')];
  const SWORD_Y = [175, 236, 298, 360];
  let sel = 0, modal = null;
  function select(i, sound) {
    if (sound && i !== sel) hover();
    sel = i;
    hots.forEach((b, n) => b.classList.toggle('sel', n === i));
    $('sword').style.setProperty('--sw', SWORD_Y[i]);
    hots[i].focus({ preventScroll: true });
  }
  function openModal(name) {
    modal = $('m-' + name);
    if (name === 'options') {
      draft = { ...cfg };
      applyDraft();
    }
    modal.classList.add('on');
    $('menu').inert = true;
    modal.querySelector('[data-close]').focus();
  }
  function closeModal() {
    if (!modal) return;
    if (modal.id === 'm-options') { draft = { ...cfg }; applyDraft(); }   // batalkan yang belum diterapkan
    modal.classList.remove('on'); modal = null;
    $('menu').inert = false;
    select(sel);
  }
  const ACTIONS = {
    play:    () => { playStartSound(); transition(() => show('map')); screen = 'moving'; },
    chars:   () => openModal('chars'),
    options: () => openModal('options'),
    quit:    () => openModal('quit')
  };
  hots.forEach((b, i) => {
    b.addEventListener('pointerenter', () => select(i, true));
    b.addEventListener('focus', () => { if (sel !== i) select(i, true); });
    b.addEventListener('click', e => {
      e.stopPropagation();
      if (screen !== 'menu') return;
      select(i); click(); ACTIONS[b.dataset.act]();
    });
  });
  document.querySelectorAll('[data-close]').forEach(b =>
    b.addEventListener('click', () => { click(); closeModal(); }));

  $('yes').addEventListener('click', () => {
    click(); closeModal(); stopMusic(); show('bye');
    window.close();            // hanya berhasil jika jendela dibuka lewat skrip
    $('again').focus();
  });
  $('again').addEventListener('click', () => location.reload());
  $('mapBack').addEventListener('click', () => { click(); toMenu(); });
  function toMenu() { screen = 'moving'; transition(() => show('menu')); }

  /* ---------- Kontrol pengaturan ---------- */
  const applyBtns = [...document.querySelectorAll('#m-options .apply')];
  const flags = [...document.querySelectorAll('.flag')];
  const isDirty = () => Object.keys(DEF).some(k => draft[k] !== cfg[k]);

  // tampilkan pratinjau dari nilai draft
  function applyDraft() {
    ['volume', 'bright', 'scale'].forEach(k => {
      const el = $(k);
      el.value = draft[k];
      el.style.setProperty('--p', (draft[k] - el.min) / (el.max - el.min) * 100 + '%');
      $(k + 'Out').textContent = draft[k] + '%';
    });
    flags.forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === draft.lang));
    document.documentElement.lang = draft.lang;
    document.querySelectorAll('[data-t]').forEach(el => el.textContent = t(el.dataset.t));
    if (!started) start.textContent = t('start');
    if (ready) pct.textContent = t('done');
    // 60% = terang normal, 85% = ukuran UI normal
    world.style.filter = draft.bright === 60 ? '' : `brightness(${(0.4 + draft.bright / 100).toFixed(2)})`;
    stage.style.setProperty('--ui', (draft.scale / 85).toFixed(3));
    applyVolume();
    applyBtns.forEach(b => b.classList.toggle('dirty', isDirty()));
  }
  ['volume', 'bright', 'scale'].forEach(k =>
    $(k).addEventListener('input', e => { draft[k] = Number(e.target.value); applyDraft(); }));
  $('volume').addEventListener('change', click);
  flags.forEach(b => b.addEventListener('click', () => { draft.lang = b.dataset.lang; click(); applyDraft(); }));

  applyBtns.forEach(b => b.addEventListener('click', () => {
    click();
    cfg = { ...draft };
    try { localStorage.setItem('hutan-cfg2', JSON.stringify(cfg)); } catch (e) {}
    applyDraft();
    applyBtns.forEach(x => {
      x.classList.remove('dirty');
      (x.querySelector('span') || x).textContent = t('saved');
    });
    setTimeout(applyDraft, 900);
  }));
  /* ---------- Map ---------- */
  const cv = $('mapCanvas'), g = cv.getContext('2d');
  const box = (x, y, w, h, c) => { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), w, h); };
  const RIVER = { x: 228, w: 34 }, BRIDGE = { y: 88, h: 28 };
  const TREES = [[18,30],[48,18],[84,34],[140,16],[185,30],[16,150],[46,172],[196,166],[160,180],
                 [292,28],[322,52],[314,150],[284,174],[18,92]];
  const GRASS = Array.from({ length: 220 }, (_, i) => [(i * 97) % 344, (i * 53 + (i % 7) * 11) % 192]);
  const TENT = { x: 72, y: 62 }, FIRE = { x: 126, y: 76 };
  const hero = { x: 126, y: 106, dir: 1, walk: 0 };
  const keys = new Set();
  let target = null, last = 0;

  function blocked(x, y) {
    if (x < 6 || x > 338 || y < 16 || y > 188) return true;
    if (x > RIVER.x - 4 && x < RIVER.x + RIVER.w + 4 && (y < BRIDGE.y + 6 || y > BRIDGE.y + BRIDGE.h - 1)) return true;
    if (TREES.some(([tx, ty]) => Math.abs(x - tx) < 9 && Math.abs(y - (ty + 8)) < 7)) return true;
    if (Math.abs(x - TENT.x) < 24 && y > TENT.y - 14 && y < TENT.y + 8) return true;
    return Math.abs(x - FIRE.x) < 10 && Math.abs(y - FIRE.y) < 7;
  }
  function drawMap(t) {
    box(0, 0, 344, 192, '#2f6b3a');
    GRASS.forEach(([x, y], i) => box(x, y, 1, 3, i % 3 ? '#3f8447' : '#25572f'));
    box(54, 94, 290, 18, '#8a6a42'); box(116, 66, 22, 30, '#8a6a42');
    box(RIVER.x - 3, 0, RIVER.w + 6, 192, '#6b5a3a'); box(RIVER.x, 0, RIVER.w, 192, '#2b6f9e');
    for (let i = 0; i < 16; i++)
      box(RIVER.x + 4 + (i * 13) % 22, (i * 29 + t / 45) % 192, 6, 1, '#8fd0ee');
    box(RIVER.x - 6, BRIDGE.y, RIVER.w + 12, BRIDGE.h, '#4a2c17');
    for (let x = RIVER.x - 4; x < RIVER.x + RIVER.w + 4; x += 6) box(x, BRIDGE.y + 3, 5, BRIDGE.h - 6, '#a8743f');
    for (let i = 0; i < 26; i++) box(TENT.x - i, TENT.y - 22 + i, i * 2 + 1, 1, i % 6 ? '#c9ab78' : '#a98d5e');
    box(TENT.x - 6, TENT.y - 8, 13, 12, '#3a2516');
    const f = Math.floor(t / 130) % 2;
    box(FIRE.x - 9, FIRE.y + 2, 19, 4, '#5a3418'); box(FIRE.x - 5, FIRE.y - 6 - f * 2, 11, 9 + f * 2, '#ff7a1f');
    box(FIRE.x - 2, FIRE.y - 3 - f, 5, 5, '#ffe27a');
  }
  function drawTree([x, y]) {
    box(x - 3, y, 6, 14, '#5a3a1e');
    box(x - 12, y - 14, 24, 17, '#173f24'); box(x - 8, y - 20, 16, 8, '#173f24');
    box(x - 8, y - 15, 12, 8, '#256033');
  }
  function drawHero() {
    const { x, y, dir } = hero, s = Math.floor(hero.walk * 8) % 2;
    box(x - 6, y - 1, 12, 3, 'rgba(0,0,0,.3)');
    box(x - 4, y - 3 - s, 3, 4, '#2a1a0c'); box(x + 1, y - 4 + s, 3, 4, '#2a1a0c');
    box(x - 5, y - 8, 10, 5, '#2f6b45'); box(x - 5, y - 13, 10, 6, '#6b5234');
    box(x - 4, y - 19, 8, 7, '#c68a5e'); box(x - 4, y - 15, 8, 4, '#eeeae0');
    box(x - 2 + dir * 2, y - 17, 1, 1, '#000'); box(x + 1 + dir * 2, y - 17, 1, 1, '#000');
    box(x - 4, y - 23, 8, 5, '#14100e');
  }
  function loop(ts) {
    if (screen !== 'map') return;
    const dt = last ? Math.min(.05, (ts - last) / 1000) : 0; last = ts;
    let dx = (keys.has('ArrowRight') || keys.has('KeyD')) - (keys.has('ArrowLeft') || keys.has('KeyA'));
    let dy = (keys.has('ArrowDown') || keys.has('KeyS')) - (keys.has('ArrowUp') || keys.has('KeyW'));
    if (!dx && !dy && target) {
      const tx = target.x - hero.x, ty = target.y - hero.y, d = Math.hypot(tx, ty);
      if (d > 2) { dx = tx / d; dy = ty / d; }
    }
    if (dx || dy) {
      const n = Math.max(1, Math.hypot(dx, dy)), v = 60 * dt;
      const nx = hero.x + dx / n * v, ny = hero.y + dy / n * v;
      if (!blocked(nx, hero.y)) hero.x = nx;
      if (!blocked(hero.x, ny)) hero.y = ny;
      if (Math.abs(dx) > .3) hero.dir = Math.sign(dx);
      hero.walk += dt;
    }
    drawMap(ts);
    // urut berdasarkan posisi Y supaya karakter bisa berada di belakang pohon
    const objs = TREES.map(p => ({ y: p[1] + 12, draw: () => drawTree(p) }));
    objs.push({ y: hero.y, draw: drawHero });
    objs.sort((a, b) => a.y - b.y).forEach(o => o.draw());
    requestAnimationFrame(loop);
  }
  function point(e) {
    const r = cv.getBoundingClientRect();
    target = { x: (e.clientX - r.left) / r.width * 344, y: (e.clientY - r.top) / r.height * 192 };
  }
  cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); point(e); });
  cv.addEventListener('pointermove', e => { if (target) point(e); });
  ['pointerup', 'pointercancel'].forEach(n => cv.addEventListener(n, () => target = null));

  /* ---------- Interaksi ---------- */
  let started = false;
  function startGame() {
    if (!ready || started) return;
    started = true;

    playStartSound();
    startMusic();

    flash.classList.remove('on'); void flash.offsetWidth; flash.classList.add('on');
    start.textContent = t('loading');
    setTimeout(() => transition(() => show('menu')), 900);
  }

  stage.addEventListener('click', startGame);
  document.addEventListener('keydown', e => {
    if (screen === 'title') {
      if (e.code === 'Enter' || e.code === 'Space') { e.preventDefault(); startGame(); }
    } else if (modal) {
      if (e.code === 'Escape') closeModal();
    } else if (screen === 'menu') {
      const d = { ArrowUp: -1, KeyW: -1, ArrowDown: 1, KeyS: 1 }[e.code];
      if (d) { e.preventDefault(); select((sel + d + hots.length) % hots.length, true); }
    } else if (screen === 'map') {
      if (e.code === 'Escape') toMenu();
      else if (/^(Arrow|Key[WASD])/.test(e.code)) { e.preventDefault(); keys.add(e.code); }
    }
  });
  document.addEventListener('keyup', e => keys.delete(e.code));
  window.addEventListener('blur', () => { keys.clear(); target = null; });
  applyDraft();
})();
</script>
</body>
</html>
