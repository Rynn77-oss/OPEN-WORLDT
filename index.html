<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Petualangan di Hutan</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0; height: 100%;
    background: #050806; overflow: hidden;
  }
  body { display: flex; align-items: center; justify-content: center; }

  /* Frame utama: rasio 1376:768, selalu muat di layar */
  .stage {
    position: relative;
    width: min(100vw, calc(100vh * 1.79167));
    aspect-ratio: 1376 / 768;
    container-type: inline-size;
    overflow: hidden;
    border-radius: 2.4% / 3.6%;
    background: #000;
    box-shadow: 0 0 60px rgba(120, 255, 170, .08), inset 0 0 90px rgba(0,0,0,.6);
  }

  /* Semua koordinat di bawah dalam piksel gambar asli (1376x768), diskalakan via --u */
  .world {
    position: absolute; inset: 0;
    --u: calc(100cqw / 1376);
    font-family: 'Press Start 2P', monospace;
  }

  .bg {
    position: absolute; inset: 0;
    background: url('loading.jpg') center / 100% 100% no-repeat;
    image-rendering: pixelated;
  }

  /* Pantulan/kilau air sungai */
  .shimmer {
    position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(100deg,
      transparent 0, transparent calc(var(--u) * 34),
      rgba(220,255,255,.22) calc(var(--u) * 40),
      transparent calc(var(--u) * 48));
    background-size: calc(var(--u) * 220) 100%;
    mix-blend-mode: screen;
    clip-path: polygon(
      calc(var(--u)*790) calc(var(--u)*462),
      calc(var(--u)*900) calc(var(--u)*470),
      calc(var(--u)*1010) calc(var(--u)*490),
      calc(var(--u)*1376) calc(var(--u)*500),
      calc(var(--u)*1376) calc(var(--u)*556),
      calc(var(--u)*1100) calc(var(--u)*560),
      calc(var(--u)*950) calc(var(--u)*540),
      calc(var(--u)*800) calc(var(--u)*500));
    animation: shine 3.5s linear infinite;
  }
  @keyframes shine {
    from { background-position: 0 0; }
    to   { background-position: calc(var(--u) * 220) 0; }
  }

  /* Cahaya api unggun */
  .glow {
    position: absolute; pointer-events: none;
    left: calc(var(--u) * 770); top: calc(var(--u) * 400);
    width: calc(var(--u) * 170); height: calc(var(--u) * 200);
    background: radial-gradient(ellipse at 50% 60%,
      rgba(255,160,60,.55), rgba(255,90,20,.18) 40%, transparent 70%);
    mix-blend-mode: screen;
    animation: flicker 1.1s steps(1, end) infinite;
  }
  @keyframes flicker {
    0%   { opacity: .7;  transform: scale(1); }
    33%  { opacity: 1;   transform: scale(1.05, 1.08); }
    66%  { opacity: .8;  transform: scale(.97, 1.02); }
    100% { opacity: .95; transform: scale(1.02, 1.06); }
  }

  /* Potongan gambar (clone) untuk efek napas kakek dan menghapus ZZZ bawaan */
  .clone {
    position: absolute; pointer-events: none;
    left: calc(var(--u) * var(--x));
    top: calc(var(--u) * var(--y));
    width: calc(var(--u) * var(--w));
    height: calc(var(--u) * var(--h));
    background-image: url('loading.jpg');
    background-size: calc(var(--u) * 1376) calc(var(--u) * 768);
    background-position:
      calc(var(--u) * var(--x) * -1)
      calc(var(--u) * (var(--y) - var(--dy, 0)) * -1);
    image-rendering: pixelated;
  }
  .breath {
    transform-origin: 50% 100%;
    animation: breathe 3.6s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { transform: scale(1, 1); }
    50%      { transform: scale(1.02, 1.035); }
  }

  /* ZZZ melayang */
  .zz {
    position: absolute; pointer-events: none;
    left: calc(var(--u) * 716); top: calc(var(--u) * 330);
    width: calc(var(--u) * 70); height: calc(var(--u) * 50);
    animation: bob 2.6s ease-in-out infinite;
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(calc(var(--u) * -6)); }
  }
  .z {
    position: absolute;
    left: calc(var(--u) * var(--x));
    top: calc(var(--u) * var(--y));
    font-size: calc(var(--u) * var(--s));
    color: #d6ecff;
    text-shadow: 0 calc(var(--u) * 2) 0 #1d3a6b;
    animation: zfade 2.4s ease-in-out infinite;
    animation-delay: var(--d);
    opacity: .25;
  }
  @keyframes zfade {
    0%, 100% { opacity: .25; }
    50%      { opacity: 1; }
  }

  /* Percikan api */
  .spark {
    position: absolute; pointer-events: none;
    left: calc(var(--u) * var(--x));
    top: calc(var(--u) * var(--y));
    width: calc(var(--u) * 3); height: calc(var(--u) * 3);
    background: #ffd36b;
    box-shadow: 0 0 calc(var(--u) * 4) #ff8a2a;
    animation: rise linear forwards;
  }
  @keyframes rise {
    0%   { transform: translate(0, 0); opacity: 1; }
    100% {
      transform: translate(calc(var(--u) * var(--dx)), calc(var(--u) * var(--rise) * -1));
      opacity: 0;
    }
  }

  /* Kunang-kunang */
  .fly {
    position: absolute; pointer-events: none;
    left: calc(var(--u) * var(--x));
    top: calc(var(--u) * var(--y));
    width: calc(var(--u) * 4); height: calc(var(--u) * 4);
    background: #eaff9a; border-radius: 50%;
    box-shadow: 0 0 calc(var(--u) * 6) 2px rgba(220,255,120,.9);
    animation: drift var(--t) ease-in-out infinite alternate,
               twinkle 1.8s ease-in-out infinite;
  }
  @keyframes drift {
    from { transform: translate(0, 0); }
    to   { transform: translate(calc(var(--u) * var(--dx)), calc(var(--u) * var(--dy))); }
  }
  @keyframes twinkle {
    0%, 100% { opacity: .15; }
    50%      { opacity: 1; }
  }

  /* Loading bar (mengikuti bingkai di gambar: x 430–945, y 695–738) */
  .fill {
    position: absolute; pointer-events: none;
    left: calc(var(--u) * 441); top: calc(var(--u) * 704);
    height: calc(var(--u) * 24);
    width: calc(var(--u) * 496 * var(--p, 0));
    background: repeating-linear-gradient(90deg,
      #8dff6a 0 calc(var(--u) * 10),
      #3fb84a calc(var(--u) * 10) calc(var(--u) * 14));
    box-shadow: inset 0 calc(var(--u) * -4) 0 #1f6b2a,
                inset 0 calc(var(--u) * 4) 0 #d8ffc0;
  }
  .pct {
    position: absolute; pointer-events: none;
    left: calc(var(--u) * 430); top: calc(var(--u) * 660);
    width: calc(var(--u) * 515);
    text-align: center;
    font-size: calc(var(--u) * 10);
    color: #fff;
    text-shadow: 0 2px 0 #000, 0 0 8px #000;
  }

  /* Tulisan PENCET UNTUK MULAI */
  .start {
    position: absolute; z-index: 12;
    left: calc(var(--u) * 430); top: calc(var(--u) * 694);
    width: calc(var(--u) * 515); height: calc(var(--u) * 44);
    box-sizing: border-box;
    display: flex; align-items: center; justify-content: center;
    background: rgba(10, 18, 12, .94);
    border: calc(var(--u) * 3) solid #2a1a0c;
    color: #ffe27a;
    font-size: calc(var(--u) * 16);
    text-shadow: 0 calc(var(--u) * 3) 0 #5a2d0c;
    white-space: nowrap;
    cursor: pointer; user-select: none;
    visibility: hidden;
  }
  .start:hover { background: rgba(30, 50, 30, .95); }
  .start.show { visibility: visible; animation: blink 1s step-end infinite; }
  .start.fast { animation: blink .22s step-end infinite; }
  @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } }

  /* Efek transisi */
  .flash {
    position: absolute; inset: 0; pointer-events: none; z-index: 25;
    background: #fff; opacity: 0;
  }
  .flash.on { animation: flash .35s ease-out; }
  @keyframes flash { 0% { opacity: .85; } 100% { opacity: 0; } }

  .fade {
    position: absolute; inset: 0; pointer-events: none; z-index: 26;
    background: #000; opacity: 0;
    transition: opacity 1.2s ease;
  }
  .fade.on { opacity: 1; }

  .msg {
    position: absolute; inset: 0; z-index: 27;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: calc(var(--u) * 24);
    color: #ffe27a; text-align: center;
    opacity: 0; transition: opacity 1s ease; pointer-events: none;
  }
  .msg.on { opacity: 1; }
  .msg .big { font-size: calc(var(--u) * 36); text-shadow: 0 calc(var(--u)*4) 0 #5a2d0c; }
  .msg .small { font-size: calc(var(--u) * 12); color: #cfe8c0; }

  /* Efek CRT: garis pindai + vignette + kedip halus */
  .crt {
    position: absolute; inset: 0; pointer-events: none; z-index: 40;
    border-radius: inherit;
    animation: crtflick 6s infinite;
  }
  .crt::before {
    content: ""; position: absolute; inset: 0;
    background: repeating-linear-gradient(0deg,
      rgba(0,0,0,.22) 0 1px, transparent 1px 3px);
    opacity: .6;
  }
  .crt::after {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(ellipse at center,
      transparent 60%, rgba(0,0,0,.6) 100%);
    box-shadow: inset 0 0 60px rgba(0,0,0,.6);
  }
  @keyframes crtflick {
    0%, 100% { opacity: 1; }
    92%      { opacity: .97; }
    94%      { opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01s !important; animation-iteration-count: 1 !important; }
  }
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="world" id="world">

    <div class="bg"></div>
    <div class="shimmer"></div>
    <div class="glow"></div>

    <!-- Napas kakek -->
    <div class="clone breath" style="--x:628; --y:440; --w:104; --h:124"></div>

    <!-- Tutup ZZZ bawaan dengan langit di atasnya -->
    <div class="clone" style="--x:714; --y:346; --w:64; --h:50; --dy:52"></div>

    <!-- ZZZ animasi -->
    <div class="zz">
      <span class="z" style="--s:10; --x:6;  --y:46; --d:0s">Z</span>
      <span class="z" style="--s:13; --x:20; --y:30; --d:.5s">Z</span>
      <span class="z" style="--s:16; --x:36; --y:14; --d:1s">Z</span>
    </div>

    <!-- Loading bar -->
    <div class="fill" id="fill"></div>
    <div class="pct" id="pct">MEMUAT 0%</div>

    <!-- Tombol mulai -->
    <div class="start" id="start">PENCET UNTUK MULAI</div>

    <!-- Efek transisi -->
    <div class="flash" id="flash"></div>
    <div class="fade" id="fade"></div>
    <div class="msg" id="msg">
      <div class="big">PETUALANGAN DIMULAI!</div>
      <div class="small">Tekan F5 untuk mengulang</div>
    </div>
  </div>
  <div class="crt"></div>
</div>

<script>
(() => {
  const world = document.getElementById('world');
  const fill  = document.getElementById('fill');
  const pct   = document.getElementById('pct');
  const start = document.getElementById('start');
  const flash = document.getElementById('flash');
  const fade  = document.getElementById('fade');
  const msg   = document.getElementById('msg');

  /* ---------- Kunang-kunang ---------- */
  const flies = [
    [165,318],[340,178],[497,328],[838,320],[1110,175],[1088,268],
    [880,295],[1160,378],[612,355],[330,290],[1020,400],[260,230],[1230,300]
  ];
  flies.forEach(([x, y]) => {
    const f = document.createElement('div');
    f.className = 'fly';
    f.style.setProperty('--x', x);
    f.style.setProperty('--y', y);
    f.style.setProperty('--dx', (Math.random() * 40 - 20).toFixed(1));
    f.style.setProperty('--dy', (Math.random() * 30 - 15).toFixed(1));
    f.style.setProperty('--t', (3 + Math.random() * 3).toFixed(2) + 's');
    f.style.animationDelay = `-${(Math.random() * 5).toFixed(2)}s, -${(Math.random() * 2).toFixed(2)}s`;
    world.appendChild(f);
  });

  /* ---------- Percikan api unggun ---------- */
  function spark() {
    const s = document.createElement('i');
    s.className = 'spark';
    s.style.setProperty('--x', (852 + Math.random() * 30 - 15).toFixed(1));
    s.style.setProperty('--y', (520 + Math.random() * 20).toFixed(1));
    s.style.setProperty('--dx', (Math.random() * 40 - 20).toFixed(1));
    s.style.setProperty('--rise', (90 + Math.random() * 80).toFixed(0));
    s.style.animationDuration = (0.8 + Math.random() * 0.9).toFixed(2) + 's';
    world.appendChild(s);
    setTimeout(() => s.remove(), 1800);
  }
  setInterval(spark, 140);

  /* ---------- Loading bar ---------- */
  const DUR = 3600;
  let t0 = null, ready = false;
  const smooth = x => x * x * (3 - 2 * x);

  function tick(ts) {
    if (t0 === null) t0 = ts;
    const x = Math.min(1, (ts - t0) / DUR);
    const p = smooth(x);
    fill.style.setProperty('--p', p.toFixed(4));
    pct.textContent = 'MEMUAT ' + Math.floor(p * 100) + '%';
    if (x < 1) requestAnimationFrame(tick);
    else finishLoading();
  }

  function finishLoading() {
    pct.textContent = 'SIAP!';
    ready = true;
    setTimeout(() => start.classList.add('show'), 300);
  }
  requestAnimationFrame(tick);

  /* ---------- Suara retro (Web Audio) ---------- */
  let ac = null;
  function getAC() {
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    return ac;
  }
  function beep(freq, dur, when = 0, type = 'square', vol = 0.12) {
    const ctx = getAC();
    const o = ctx.createOscillator(), g = ctx.createGain();
    const t = ctx.currentTime + when;
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(ctx.destination);
    o.start(t);
    o.stop(t + dur + 0.02);
  }
  function playStartSound() {
    [523, 659, 784, 1047].forEach((f, i) => beep(f, 0.12, i * 0.09));
    beep(120, 0.3, 0.4, 'sawtooth', 0.08);
  }

  /* ---------- Interaksi ---------- */
  let started = false;
  function startGame() {
    if (!ready || started) return;
    started = true;

    playStartSound();

    flash.classList.remove('on'); void flash.offsetWidth; flash.classList.add('on');

    start.classList.add('fast');
    start.textContent = 'MEMUAT GAME...';

    setTimeout(() => fade.classList.add('on'), 1200);
    setTimeout(() => {
      start.classList.remove('show', 'fast');
      start.style.visibility = 'hidden';
      msg.classList.add('on');
    }, 2600);
  }

  start.addEventListener('click', startGame);
  document.getElementById('stage').addEventListener('click', e => {
    if (e.target === start) return;
    startGame();
  });
  document.addEventListener('keydown', e => {
    if (e.code === 'Enter' || e.code === 'Space') {
      e.preventDefault();
      startGame();
    }
  });
})();
</script>
</body>
</html>
